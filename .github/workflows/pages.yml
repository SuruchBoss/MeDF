name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a newer push finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the static site
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Configure Pages
        id: pages
        # Tries to turn Pages on, which the default GITHUB_TOKEN is usually not
        # allowed to do. Let it fail softly so the next step can say what to do
        # about it instead of leaving a bare API error in the log.
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Require Pages to be enabled
        if: steps.pages.outcome != 'success'
        run: |
          echo "::error title=ยังไม่ได้เปิด GitHub Pages::ให้ผู้มีสิทธิ์ admin ของ repository ไปที่ Settings → Pages → Build and deployment → Source แล้วเลือก 'GitHub Actions' หนึ่งครั้ง จากนั้นรัน workflow นี้อีกครั้ง (GITHUB_TOKEN ของ Actions ไม่มีสิทธิ์สร้าง Pages site เอง)"
          exit 1

      - name: Build
        run: npm run build
        env:
          # e.g. "/MeDF" for https://<user>.github.io/MeDF/, "" for a custom
          # domain served from the root.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Verify the exported site really works
        run: npm run test:demo
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
