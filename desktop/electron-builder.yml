appId: com.medf.app
productName: MeDF
copyright: Copyright © MeDF

directories:
  output: dist
  buildResources: build

# Only the shell lives in app.asar. The Next.js server bundle ships as an
# unpacked resource because it is launched as a child process, which cannot
# read from inside an archive.
files:
  - src/**/*
  - build/icon.png
  - package.json

asar: true
afterPack: scripts/after-pack.cjs
compression: normal
removePackageScripts: true

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  artifactName: MeDF-Setup-${version}-${arch}.${ext}
  fileAssociations:
    - ext: pdf
      name: PDF Document
      description: เปิดด้วย MeDF
      role: Editor
      icon: build/icon.ico

nsis:
  # Per-user install: no administrator rights required.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MeDF
  uninstallDisplayName: MeDF ${version}
  deleteAppDataOnUninstall: false
  artifactName: MeDF-Setup-${version}-${arch}.${ext}

portable:
  artifactName: MeDF-Portable-${version}-${arch}.${ext}

publish: null
